<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rafting Travel to ask questions, get trip information, or learn more about our exciting white water rafting adventures.">
    <meta name="author" content="Eliza Juancho Cinco">
    <title>Contact Us | Rafting Travel </title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-raftingcompas.jpg" alt="Rafting Travel">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <!---Company Information-->
        <section class="contact information">

            <div class="company-details">
                <h2>Get in Touch</h2>
                <p>
                    <strong>Addres:</strong><br>
                    123 River Adventure Road<br>
                    Rapids Valley, USA
                </p>

                <p>
                    <strong>Phone:</strong><br>
                    +1 (555) 123-4567
                </p>

                <p>
                    <strong>Email:</strong><br>
                    info@raftingtravel.com
                </p>
            </div>

            <iframe src="https://www.google.com/maps/embed?pb=1m" title="Rafting Travel location"
              loading="lazy">
            </iframe>

        </section>

        <!--Emplyee Profiles-->
        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg"
                      alt="Marcus Vance, Rafting Travel General Manager">
                    <figcaption>
                        Marcus Vance<br>
                        <span>General Manager/span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg"
                      alt="Elena Cruz, Rafting Travel Head River Guide">

                    <figcaption>
                        Elena Cruz<br>
                        <span>Head River Guide</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg"
                      alt="Jordan Lee, Rafting Travel Reservation Specialist">
                    <figcaption>
                        Jordan Lee<br>
                        <span>Reservation Specialist</span>
                    </figcaption>
                </figure>
            </div>

        </section>

        <!--Contact Form-->
        <section class="contact-form-section">

            <h2>Send Us a Message</h2>
            <form class="contact-form">

                <div class="form-item">
                    <label for="name">
                        Eliza Juancho Cinco
                    </label>

                    <input type="text" id="name" name="name" required>
                </div>

                <fieldset>
                    <legend>
                        Purpose of Your Message
                    </legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" required>

                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservatio-question">

                        Reservation Question
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">
                        Your Message
                    </label>

                    <textarea id="message" name="message" row="6" required>
                    </textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">

                    Please subscribe me to the monthy newsletter
                </label>

                <button type="submit">
                    Send My Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            © 2026 Rafting Travel | Eliza Juancho Cinco
        </p>

        <nav class=" socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/social-media_13651151.png" alt="Facebook">
            </a>

            <a href="https://www.instagram.com">
                <img src="images/heart_12079989.png" alt="Instagram">
            </a>

            <a href="https://www.youtube.com">
                <img src="images/social_14743544.png" alt="Youtube">
            </a>
        </nav>
    </footer>

</body>

</html>
